<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全屏骨架屏示例</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f5f6fa;
        }
        .skeleton-bg {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
        .skeleton-header {
            height: 64px;
            width: 100%;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            border-bottom: 1px solid #e2e5e7;
        }
        .skeleton-logo {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #e2e5e7;
            margin-right: 24px;
            position: relative;
            overflow: hidden;
        }
        .skeleton-title {
            width: 200px;
            height: 24px;
            border-radius: 4px;
            background: #e2e5e7;
            position: relative;
            overflow: hidden;
        }
        .skeleton-main {
            flex: 1;
            display: flex;
            padding: 40px 80px;
            box-sizing: border-box;
            gap: 40px;
        }
        .skeleton-sidebar {
            width: 240px;
            min-width: 200px;
            background: #fff;
            border-radius: 8px;
            padding: 24px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .skeleton-sidebar-item {
            width: 100%;
            height: 20px;
            border-radius: 4px;
            background: #e2e5e7;
            position: relative;
            overflow: hidden;
        }
        .skeleton-content {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            padding: 32px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .skeleton-card {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            background: #e2e5e7;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .skeleton-row {
            width: 100%;
            height: 18px;
            border-radius: 4px;
            background: #e2e5e7;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .skeleton-row.short {
            width: 60%;
        }
        /* 骨架动画 */
        .skeleton-logo::after,
        .skeleton-title::after,
        .skeleton-sidebar-item::after,
        .skeleton-card::after,
        .skeleton-row::after {
            content: "";
            display: block;
            position: absolute;
            left: -150px;
            top: 0;
            height: 100%;
            width: 150px;
            background: linear-gradient(90deg, transparent, #f0f1f3, transparent);
            animation: loading 1.2s infinite;
        }
        @keyframes loading {
            100% {
                left: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="skeleton-bg">
        <div class="skeleton-header">
            <div class="skeleton-logo"></div>
            <div class="skeleton-title"></div>
        </div>
        <div class="skeleton-main">
            <div class="skeleton-sidebar">
                <div class="skeleton-sidebar-item"></div>
                <div class="skeleton-sidebar-item"></div>
                <div class="skeleton-sidebar-item"></div>
                <div class="skeleton-sidebar-item"></div>
                <div class="skeleton-sidebar-item"></div>
                <div class="skeleton-sidebar-item"></div>
            </div>
            <div class="skeleton-content">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row short"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row short"></div>
            </div>
        </div>
    </div>
</body>
</html>
