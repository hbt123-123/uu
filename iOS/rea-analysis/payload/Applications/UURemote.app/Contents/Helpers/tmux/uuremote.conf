# UURemote tmux configuration
# This file is loaded via `tmux -f uuremote.conf`, replacing ~/.tmux.conf
# All UURemote tmux sessions use this config exclusively

# Prefix key: Ctrl+] (avoid conflict with shell/editor shortcuts)
set -g prefix C-]
unbind C-b

# Hide status bar (remote terminal UI is rendered by controller side)
set -g status off

# Forward window name as the outer terminal (Terminal.app) title.
# 本地镜像终端顶部标题显示会话名（默认名 / rename 名）：
# - set-titles on + set-titles-string 让 tmux 主动向外层 Terminal.app 发送标题转义序列，
#   覆盖 Terminal.app 默认拼接（用户 — 脚本名 — 进程名）。
# - automatic-rename off / allow-rename off 固定 window_name，
#   避免前台进程（vim/top 等）或 shell 转义序列改写标题，标题恒等于会话名。
set -g set-titles on
set -g set-titles-string "#{window_name}"
set -g automatic-rename off
set -g allow-rename off

# Strip inherited $TMUX / $TMUX_PANE from the pane shell so the user can run
# their own installed tmux nested inside this session.
# 外层 uuyc-mux 会自动给 pane shell 注入 $TMUX（指向私有 socket），用户在会话内敲自己的
# tmux 时会命中 tmux 的嵌套保护而报错（sessions should be nested with care）。
# 这里在 pane shell 启动时先 unset，再以 login shell 方式接管：
# - 外层 client↔server 靠显式 `-S <socket>` 维持，不读 $TMUX，故此改动不影响外层连接/重连/detach；
# - pane 内环境无 $TMUX 后，用户 tmux 可正常连自己的默认 socket，attach 到既有工作区；
# - exec "$SHELL" -l 保持 login shell 语义（source ~/.zprofile/.zshrc，PATH 含 homebrew 等）。
# 单引号包裹避免 tmux 预展开，$SHELL 交由 shell 运行时展开。
#
# 额外种入 UUYC_IN_MUX=1 静态标记：unset $TMUX 后 tmux 原生的"禁止嵌套 attach"护栏失效，
# 若在 UU 会话内再执行 `uuyc-cli mux attach/new`，会把当前 pane 所在 session attach 进
# 另一个（可能已包含它的）session，导致 attach 图成环 → hall of mirrors 无限重绘 → 卡死。
# 该标记随 pane shell 及其子进程（含 uuyc-cli）继承，供 CLI 侧识别"当前处于 UU 会话内"并拒绝
# attach/new（ls/kill/rename 不 execv 成 client，无成环风险，不受影响）。
#
# 额外 `umask 022`：launchd plist 的 Umask 0 若先于补丁拉起了 tmux server，则 server 的
# umask 已定为 0，其后 fork 的 pane shell 仍继承 0。此处在每个 pane shell 启动时强制重置为
# 022（文件 644、目录 755），兜底覆盖"server 已被污染且未重启"的场景。
#
# 额外 `ulimit -Sn unlimited`：launchd 给 UURemote 进程的 fd 软上限远低于普通登录终端
# （用户现场 9472、开发机 16384，普通 shell 为 1048575 量级），forkpty 后经 tmux client →
# server → pane 原样继承，用户 shell 里的 Node CLI（Claude Code / cursor-agent）会因 fd 不足
# 启动失败。软上限抬到硬上限（通常 unlimited，内核按 kern.maxfilesperproc 收敛），失败静默忽略。
# 注意只改软上限（-S）：不带 -S 的 `ulimit -n` 会连硬上限一起降，之后无法再抬高。
set -g default-command 'ulimit -Sn unlimited 2>/dev/null; umask 022; unset TMUX TMUX_PANE; export UUYC_IN_MUX=1; exec "$SHELL" -l'

# Terminal type for proper 256-color and true-color support
set -g default-terminal "tmux-256color"

# Window size negotiation across multiple attached clients.
# 双端同显场景：远程 client 与本地系统终端可同时 attach 同一 session，
# 两者尺寸通常不同，pane 只能取一个尺寸。本地镜像 client 使用 ignore-size，
# 远程 client 在线时由其作为 latest client 驱动尺寸；远程 detach 后本地 client 恢复接管。
# NOTE: do NOT use `manual` / `resize-window` — this tmux build crashes on startup
# with `set -g window-size manual`.
set -g window-size latest

# Scrollback buffer: 50000 lines
set -g history-limit 50000

# Auto-destroy session when no client is attached.
# 双端同显场景：主控 ctrl client 与本地系统终端任一在线即保留 session（可重连）；
# 两者都断开后 session 无 client attach，tmux 原生销毁，避免残留无主 session。
# 相比 client-detached hook 脚本，不受 hook 触发时序影响（session 真正 unattached 后才销毁）。
# [预留开关 · 当前关闭 · 策划确认 2026-08-21]
# 打开效果：无任何 client attach 时 tmux 原生自动销毁 session，避免残留无主 session。
# 当前关闭原因：用户经 uuyc-cli 本地接管场景下，允许 session 在无 client 时继续存活，
#   便于本地终端 detach/关闭后可再次 attach；不再依赖"无 client 即销毁"的生命周期。
# 恢复方式：取消下方 off 行、启用 on 行即可。
# set -g destroy-unattached on
set -g destroy-unattached off

# Enable mouse support (remote terminal forwards mouse events)
set -g mouse on

# OSC 52 剪贴板上报：允许 tmux 通过 OSC 52 转义序列向外层终端（主控端 SwiftTerm）写系统剪贴板。
# 配合下方鼠标拖拽复制绑定，实现「远端 tmux copy-mode 选中 → OSC 52 回传 → 主控端系统剪贴板」。
# 主控端 SwiftTerm 原生支持 OSC 52 接收（oscClipboard → clipboardCopy delegate → NSPasteboard）。
set -g set-clipboard on

# 强制声明外层终端支持 OSC 52 写剪贴板（Ms capability）。
# tmux 仅在 client 的 terminfo 含 Ms 能力时才发 OSC 52；主控端 SwiftTerm 上报 TERM=xterm-256color，
# 其 terminfo 未必带 Ms，导致 set-clipboard on 也不发 OSC 52（拖拽有高亮但松手不回传剪贴板）。
# 这里对所有终端类型显式覆盖 Ms 为标准 OSC 52 格式，确保 tmux 一定发出。
set -ga terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007"

# 鼠标拖拽起始（root 表）：强制进入 copy-mode 并开始拖选。
# tmux 默认 root 表 MouseDrag1Pane 走 if-shell 判定（pane_in_mode / mouse_any_flag），
# 主控端 SwiftTerm 上报的 SGR 拖拽序列在该判定下未能进入 copy-mode（拖拽无高亮）。
# 这里显式绑定，绕过默认判定：非 copy-mode → copy-mode -M（用鼠标进入并起始选区）；
# 已在 copy-mode → begin-selection（继续拖选）。
bind -Troot MouseDrag1Pane if-shell -F "#{pane_in_mode}" "send -X begin-selection" "copy-mode -M"

# 鼠标拖拽结束（松开）时，复制选区并退出 copy-mode，双通道写剪贴板：
# 1) copy-pipe "pbcopy"：管道把选区喂给 pbcopy → 写「被控本机系统剪贴板」，
#    被控端 cli（Terminal.app）场景直接生效，不依赖 Terminal.app 的 OSC 52 权限。
# 2) 同时 set-clipboard on 使 copy 发出 OSC 52 → 回传「主控端 SwiftTerm 剪贴板」。
# 两条通道并行，覆盖被控 cli 与主控远程两端复制需求。
bind -Tcopy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Scroll one history line per wheel tick instead of tmux's default five lines.
bind -Tcopy-mode WheelUpPane { select-pane; send -N1 -X scroll-up }
bind -Tcopy-mode WheelDownPane { select-pane; send -N1 -X scroll-down }
bind -Tcopy-mode-vi WheelUpPane { select-pane; send -N1 -X scroll-up }
bind -Tcopy-mode-vi WheelDownPane { select-pane; send -N1 -X scroll-down }

# Disable escape delay (improves responsiveness for remote input)
set -g escape-time 0
